  html += section("week", "Wykreślone w ostatnim tygodniu", "", `<section class="block week">${last.map(x => `<div class="wd"><span class="wn">${x.n||""}</span><div class="wb ${x.n?"":"zero"}" style="height:${8 + x.n/mx*70}px"></div><span>${WD_SHORT[parseYmd(x.d).getDay()]}</span></div>`).join("")}</section>${!Object.keys(state.meta.doneAt).length ? `<p class="hint-line">Liczę od chwili, gdy zaczniesz wykreślać zadania w aplikacji.</p>` : ""}`);
  const tags = allTags();
  if (tags.length) html += section("tags", "Według tagów", "", `<section class="block hbars">${tags.map(g => {
    const ts = all.filter(t => t.tagi.includes(g)), dn = ts.filter(t => t.wykonane).length;
    return `<div class="hbar ${tagCls(g)}"><span class="nm">${tagPill(g)}</span><span class="track"><i style="width:${dn/ts.length*100}%;background:var(--tf)"></i></span><span class="num">${dn}/${ts.length}</span></div>`;
  }).join("")}</section>`);
  html += section("prio", "Według priorytetu", "", `<section class="block hbars">${PRIO.slice().reverse().map(p => {
    const ts = all.filter(t => t.priorytet === p), dn = ts.filter(t => t.wykonane).length;
    return `<div class="hbar"><span class="nm">${PRIO_LABEL[p]}</span><span class="track">${ts.length ? `<i style="width:${dn/ts.length*100}%;background:${PRIO_SW[p]}"></i>` : ""}</span><span class="num">${dn}/${ts.length}</span></div>`;
  }).join("")}</section>`);
  const ft = Object.entries(state.meta.focus.byTask).map(([id,m]) => [byId(+id), m]).filter(x => x[0]).sort((a,b) => b[1]-a[1]).slice(0,5);
  if (ft.length) html += section("focus", "Najwięcej czasu poświęcone", "", `<section class="block hbars">${ft.map(([t,m]) => `<div class="hbar" style="grid-template-columns:1fr 64px"><span class="nm">${esc(t.tytul)}</span><span class="num">${m} min</span></div>`).join("")}</section>`);
  return html;
}

/* =========================================================
   AKCJE NA ZADANIACH
   ========================================================= */
function toggleTask(id, rowEl){
  const t = byId(id); if (!t) return;
  const becomingDone = !t.wykonane;
  if (becomingDone && rowEl){
    rowEl.classList.add("done","just-done");
    haptic(12);
    commit(`Wykreślono: ${t.tytul}`, () => setDone(t, true), {noRender:true});
    setTimeout(render, 520);
    return;
  }
  if (becomingDone) justDone = id;
  commit(becomingDone ? `Wykreślono: ${t.tytul}` : `Przywrócono: ${t.tytul}`, () => setDone(t, becomingDone));
}

function deleteTask(id, rowEl){
  const t = byId(id); if (!t) return;
  const go = () => { if (byId(id) === t) commit(`Usunięto: ${t.tytul}`, () => removeTask(id)); };
  if (rowEl){ rowEl.style.height = rowEl.offsetHeight + "px"; requestAnimationFrame(() => { rowEl.style.height = "0px"; rowEl.style.opacity = "0"; }); setTimeout(go, 240); }
  else go();
}
const haptic = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

/* ---------- gesty: przesuń w prawo = wykreśl, w lewo = usuń ---------- */
let drag = null, suppressClick = false;
document.addEventListener("pointerdown", e => {
  const inner = e.target.closest(".row-inner"); if (!inner || e.button !== 0) return;
  if (e.target.closest(".check")) return;
  drag = { row: inner.parentElement, inner, x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId };
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3){ drag.active = true; drag.row.classList.add("dragging"); try { drag.inner.setPointerCapture(e.pointerId); } catch(_){} }
    else if (Math.abs(dy) > 10) { drag = null; return; }
    else return;
  }
  drag.dx = dx;
  drag.row.classList.toggle("sw-right", dx > 0); drag.row.classList.toggle("sw-left", dx < 0);
  const damp = Math.abs(dx) > 120 ? Math.sign(dx) * (120 + (Math.abs(dx)-120)*0.35) : dx;
  drag.inner.style.transform = `translateX(${damp}px)`;
  if (!drag.armed && Math.abs(dx) > 90){ drag.armed = true; haptic(8); }
  if (drag.armed && Math.abs(dx) < 90) drag.armed = false;
});
const endDrag = e => {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  if (!d.active) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 50);
  d.row.classList.remove("dragging");
  const id = +d.row.dataset.id;
  if (d.dx > 90){ d.inner.style.transform = ""; setTimeout(() => toggleTask(id, d.row), 120); }
  else if (d.dx < -90){ d.inner.style.transform = "translateX(-100%)"; deleteTask(id, d.row); }
  else d.inner.style.transform = "";
};
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ---------- kliknięcia (delegacja) ---------- */
document.addEventListener("click", e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const row = el.closest(".row");
  const id = el.dataset.id ? +el.dataset.id : row ? +row.dataset.id : null;
  switch (act){
    case "toggle": toggleTask(id, row); break;
    case "edit": openEditor(byId(id)); break;
    case "focus": openFocus(id); break;
    case "nextfocus": focusIdx++; render(); break;
    case "triage": openTriage(); break;
    case "plan": openPlan(byId(id)); break;
    case "relieve": openRelief(); break;
    case "day": openDay(el.dataset.d); break;
    case "tab": if (el.dataset.v === "zadania" && tab !== "zadania") { listState.tag = null; } switchTab(el.dataset.v); break;
    case "view": listState.view = el.dataset.v; if (tab !== "zadania") switchTab("zadania"); else render(); break;
    case "sidetag": listState.tag = el.dataset.v; listState.view = listState.view === "kalendarz" ? "kalendarz" : listState.view; switchTab("zadania"); break;
    case "search": listState.view = "lista"; switchTab("zadania"); setTimeout(() => $("#q")?.focus(), 0); break;
    case "new": openEditor(null); break;
    case "newin": openEditor(null, { priorytet: el.dataset.v }); break;
    case "settings": openSettings(); break;
    case "import": $("#fileInput").click(); break;
    case "export": exportFile(); break;
    case "sec": { const k = el.dataset.v; closedSecs.has(k) ? closedSecs.delete(k) : closedSecs.add(k); render(); break; }
    case "calnav": {
      const v = +el.dataset.v;
      if (v === 0) calMonth = today().slice(0,7);
      else { const [y,m] = calMonth.split("-").map(Number); const d = new Date(y, m-1+v, 1); calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
      render(); break;
    }
    case "fstatus": listState.status = el.dataset.v; render(); break;
    case "fprio": listState.prio = listState.prio === el.dataset.v ? null : el.dataset.v; render(); break;
    case "ftag": listState.tag = listState.tag === el.dataset.v ? null : el.dataset.v; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".body[data-act=edit], .bcard, .cell")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && sheetOpen) closeSheet();
  if (!sheetOpen && !e.target.closest("input,textarea,select") && !e.metaKey && !e.ctrlKey && !e.altKey){
    if (e.key === "n" || e.key === "+") { e.preventDefault(); openEditor(null); }
    if (e.key === "/") { e.preventDefault(); listState.view = "lista"; switchTab("zadania"); setTimeout(() => $("#q")?.focus(), 0); }

  }
});

/* ---------- tablica: przeciąganie kart między kolumnami ---------- */
let dragCard = null;

document.addEventListener("dragover", e => { const col = e.target.closest?.(".col"); if (col && dragCard !== null){ e.preventDefault(); $$(".col.over").forEach(c => c !== col && c.classList.remove("over")); col.classList.add("over"); } });

  else if (t.priorytet !== k || t.wykonane) commit(`${t.tytul}: priorytet ${PRIO_LABEL[k]}`, () => { t.priorytet = k; if (t.wykonane) setDone(t, false); });

/* =========================================================
   ARKUSZE (bottom sheets)

let sheetOpen = false, lastFocus = null;
function openSheet(title, bodyHTML, {full=false, onMount, onClose}={}){
  const root = $("#sheetRoot");
  if (sheetOpen) { root.innerHTML = ""; }
  lastFocus = lastFocus || document.activeElement;
  root.innerHTML = `<div class="backdrop" data-close></div>
    <div class="sheet ${full?"full":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab" aria-hidden="true"><i></i></div>
      <div class="sheet-head"><h3>${esc(title)}</h3><button class="iconbtn" data-close aria-label="Zamknij">${I.x}</button></div>
      <div class="sheet-body">${bodyHTML}</div>
    </div>`;
  sheetOpen = true; root._onClose = onClose;
  document.body.style.overflow = "hidden"; document.body.classList.add("sheet-on");
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("open")));
  $$("[data-close]", root).forEach(b => b.addEventListener("click", closeSheet));
  // przeciągnij w dół, żeby zamknąć
  const sheet = $(".sheet", root), grab = $(".grab", root);
  let sy = null;
  grab.addEventListener("pointerdown", e => { sy = e.clientY; grab.setPointerCapture(e.pointerId); sheet.style.transition = "none"; });
  grab.addEventListener("pointermove", e => { if (sy === null) return; const dy = Math.max(0, e.clientY - sy); sheet.style.transform = `translateY(${dy}px)`; });
  grab.addEventListener("pointerup", e => { if (sy === null) return; const dy = e.clientY - sy; sy = null; sheet.style.transition = ""; sheet.style.transform = ""; if (dy > 90) closeSheet(); });
  if (onMount) onMount($(".sheet-body", root));
}
function closeSheet(){
  const root = $("#sheetRoot"); if (!sheetOpen) return;
  sheetOpen = false; root.classList.remove("open");
  document.body.style.overflow = ""; document.body.classList.remove("sheet-on");
  const cb = root._onClose; root._onClose = null; if (cb) cb();
  setTimeout(() => { if (!sheetOpen) root.innerHTML = ""; }, 320);
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus({preventScroll:true}); } catch(e){} } lastFocus = null;
}

/* ---------- edytor zadania ---------- */
function openEditor(task, preset={}){
  const isNew = !task;
  const f = isNew ? { tytul:"", opis:"", termin:null, priorytet:"sredni", tagi:[], ...preset } : clone(task);
  const sessionHeader = studyParentId(f) === null ? "" : f.opis.match(/^Plan nauki \(#-?\d+\), sesja \d+ z \d+/)[0];
  const editableDescription = sessionHeader ? f.opis.slice(sessionHeader.length).trimStart() : f.opis;
  const touched = { termin: !!preset.termin, priorytet: !!preset.priorytet, tagi: !!preset.tagi };
  let ignore = {}, raw = "";
  const t0 = today();
  const quick = [["Dziś", t0], ["Jutro", addDays(t0,1)], ["Pojutrze", addDays(t0,2)], ["Piątek", todayDate().getDay()===5 ? t0 : nextWeekday(5,false)], ["Za tydzień", addDays(t0,7)], ["Bez terminu", ""]];

  const PI = { cal:I.cal, prio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>', tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/></svg>', desc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>' };
  const body = `

    ${isNew ? `<div class="parsed" id="e-parsed" aria-live="polite"></div><p class="hint">Pisz normalnie, a resztę rozpoznam: <code>jutro</code>, <code>w czwartek</code>, <code>za 3 dni</code>, <code>25.11</code>, <code>!!!</code> = wysoki, <code>#tag</code>, opis po <code>//</code>.</p>` : ""}

      <div class="pv"><div class="quick-dates" id="e-qd">${quick.map(([l,v]) => `<button type="button" class="chip" data-v="${v}">${l}</button>`).join("")}</div>
        <input id="e-date" type="date" class="inp" value="${f.termin||""}" aria-label="Data terminu"><div id="e-load"></div></div>
      <div class="pl">${PI.prio} Priorytet</div>
      <div class="pv"><div class="seg" id="e-prio" role="radiogroup" aria-label="Priorytet">${PRIO.map(p => `<button type="button" role="radio" data-v="${p}"><span class="sw" style="background:${PRIO_SW[p]}"></span>${PRIO_LABEL[p]}</button>`).join("")}</div></div>
      <div class="pl">${PI.tag} Tagi</div>
      <div class="pv"><div class="tagbox" id="e-tags"><input id="e-taginp" placeholder="dodaj tag" autocomplete="off" enterkeyhint="enter" aria-label="Nowy tag"></div><div class="sugs" id="e-sugs"></div></div>
      <div class="pl">${PI.desc} Opis</div>
      <div class="pv">${sessionHeader ? `<p class="hint">${esc(sessionHeader)}</p>` : ""}<textarea id="e-desc" class="inp" placeholder="Szczegóły, rozdziały, sala…" aria-label="Opis">${esc(editableDescription)}</textarea></div>
    </div>
    ${!isNew && f.termin && isExam(f) && !f.wykonane ? `<div class="callout">${ILL.ksiazka}<div class="nt"><b>${hasPlan(task) ? "Plan nauki już jest" : "Rozpisać naukę na sesje?"}</b><p>${hasPlan(task) ? "Sesje nauki do tego sprawdzianu są na liście." : "Dodam kilka krótkich sesji przed terminem."}</p>${hasPlan(task) ? "" : `<div class="btns"><button class="btn" id="e-plan">Rozpisz plan nauki</button></div>`}</div></div>` : ""}
    <div class="sheet-actions">
      <button class="btn primary" id="e-save">${isNew ? "Dodaj zadanie" : "Zapisz zmiany"}</button>
      ${!isNew ? `<button class="btn" id="e-toggle">${f.wykonane ? "Przywróć" : "Wykreśl"}</button>` : ""}
    </div>
    ${!isNew ? `<div class="sheet-actions" style="margin-top:8px"><button class="btn" id="e-focus">${I.timer} Skup się</button><button class="btn danger" id="e-del">${I.trash} Usuń</button></div>` : ""}`;

  openSheet(isNew ? "Nowe zadanie" : "Zadania / edycja", body, { onMount: root => {
    const title = $("#e-title", root), date = $("#e-date", root), desc = $("#e-desc", root);
    const paintPrio = () => $$("#e-prio button", root).forEach(b => { const on = String(b.dataset.v === f.priorytet); b.setAttribute("aria-pressed", on); b.setAttribute("aria-checked", on); });
    const paintDate = () => {
      date.value = f.termin || "";
      $$("#e-qd .chip", root).forEach(b => b.setAttribute("aria-pressed", (b.dataset.v || null) === (f.termin || null) ? "true" : "false"));
      const box = $("#e-load", root); box.innerHTML = "";
      if (f.termin && !f.wykonane){
        const l = lighterDay(f.termin, task?.id, f.priorytet);
        if (l && l.crowded.load + PRIO_W[f.priorytet] >= CRUNCH){
          box.innerHTML = `<div class="load-warn">${I.alert.replace("<svg",'<svg width="16" height="16" style="flex:none;margin-top:2px"')}<span>Ten dzień jest już mocno zajęty (${nTasks(l.crowded.items.length)}${l.crowded.prepFor.length?" i nauka":""}).${l.best ? ` Luźniej jest ${WD_IN[parseYmd(l.best.date).getDay()]}, ${parseYmd(l.best.date).getDate()} ${MON_SHORT[parseYmd(l.best.date).getMonth()]}. <button type="button" id="e-move">Przenieś</button>` : ""}</span></div>`;
          $("#e-move", box)?.addEventListener("click", () => { f.termin = l.best.date; touched.termin = true; paintDate(); });
        }
      }
    };
    const paintTags = () => {
      const box = $("#e-tags", root), inp = $("#e-taginp", root);
      $$(".tgx", box).forEach(x => x.remove());
      f.tagi.forEach((g,i) => { const s = document.createElement("span"); s.className = "tgx " + tagCls(g); s.innerHTML = `${esc(g)}<button type="button" aria-label="Usuń tag ${esc(g)}">${I.x.replace("<svg",'<svg width="12" height="12"')}</button>`; s.querySelector("button").onclick = () => { f.tagi.splice(i,1); touched.tagi = true; paintTags(); }; box.insertBefore(s, inp); });
      const smart = suggestTags(f.tytul || title.value, f.tagi, task?.id);
      const others = allTags().filter(g => !f.tagi.includes(g) && !smart.includes(g)).slice(0,6);
      $("#e-sugs", root).innerHTML = smart.map(g => `<button type="button" class="chip smart" data-g="${esc(g)}" title="Podpowiedź na podstawie tytułu">+ ${esc(g)}</button>`).join("") + others.map(g => `<button type="button" class="chip" data-g="${esc(g)}">${esc(g)}</button>`).join("");
      $$("#e-sugs .chip", root).forEach(b => b.onclick = () => { f.tagi.push(b.dataset.g); touched.tagi = true; paintTags(); });
    };
    const addTagFromInput = () => { const inp = $("#e-taginp", root); const v = inp.value.replace(/^#/,"").replace(/,/g,"").trim(); if (v && !f.tagi.includes(v)) { f.tagi.push(v); touched.tagi = true; } inp.value = ""; paintTags(); };

    let autoTags = [];
    const reparse = () => {
      raw = title.value;
      if (!isNew){ f.tytul = raw; paintTags(); return; }
      const p = parseQuick(raw, ignore);
      f.tytul = p.tytul;
      if (!touched.termin) f.termin = p.termin ?? (preset.termin ?? null);
      const sp = suggestPrio(raw);
      if (!touched.priorytet) f.priorytet = p.priorytet || sp || preset.priorytet || "sredni";
      // tagi z #: dopisz, usuń te, które zniknęły z tekstu
      f.tagi = f.tagi.filter(g => !autoTags.includes(g) || p.tagi.includes(g));
      for (const g of p.tagi) if (!f.tagi.includes(g)) f.tagi.push(g);
      autoTags = p.tagi;
      if (!desc.dataset.touched) desc.value = p.opis || preset.opis || "";
      const hits = p.hits.slice();
      if (!p.priorytet && sp && !touched.priorytet) hits.push({kind:"auto-prio", label:"wysoki, bo to sprawdzian"});
      $("#e-parsed", root).innerHTML = (hits.length && p.tytul ? `<span class="as">Zapiszę jako: <b>${esc(p.tytul)}</b></span>` : "") + hits.map(h => `<button type="button" data-k="${esc(h.kind)}" aria-label="Rozpoznano: ${esc(h.label)}. Kliknij, żeby zignorować">${esc(h.label)}</button>`).join("");
      $$("#e-parsed button", root).forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === "auto-prio") { touched.priorytet = true; f.priorytet = "sredni"; } else ignore[k] = true; reparse(); });
      paintDate(); paintPrio(); paintTags();
    };

    const grow = () => { title.style.height = "auto"; title.style.height = title.scrollHeight + "px"; };
    title.addEventListener("input", () => { grow(); reparse(); });
    requestAnimationFrame(grow);
    title.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#e-save", root).click(); } });
    desc.addEventListener("input", () => desc.dataset.touched = "1");
    date.addEventListener("change", () => { f.termin = date.value || null; touched.termin = true; paintDate(); });
    $$("#e-qd .chip", root).forEach(b => b.addEventListener("click", () => { f.termin = b.dataset.v || null; touched.termin = true; paintDate(); }));
    $$("#e-prio button", root).forEach(b => b.addEventListener("click", () => { f.priorytet = b.dataset.v; touched.priorytet = true; paintPrio(); paintDate(); }));
    const ti = $("#e-taginp", root);
    ti.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addTagFromInput(); } else if (e.key === "Backspace" && !ti.value && f.tagi.length) { f.tagi.pop(); paintTags(); } });
    ti.addEventListener("blur", () => { if (ti.value.trim()) addTagFromInput(); });

    $("#e-save", root).addEventListener("click", () => {
      if (ti.value.trim()) addTagFromInput();
      const tytul = (isNew ? f.tytul : title.value).trim();
      if (!tytul){ title.focus(); title.placeholder = "Tytuł jest potrzebny"; return; }
      const opis = [sessionHeader, desc.value.trim()].filter(Boolean).join("\n");
      const data = { tytul, opis, termin: f.termin || null, priorytet: f.priorytet, tagi: [...f.tagi] };
      if (isNew){
        const t = { id: nextId(), ...data, wykonane: false };
        closeSheet();
        commit(`Dodano: ${t.tytul}`, () => tasks().push(t));
        if (isExam(t) && t.termin && daysFromToday(t.termin) >= 2) setTimeout(() => toast(`To wygląda na sprawdzian. Rozpisać naukę?`, () => openPlan(byId(t.id)), "Rozpisz"), 900);
      } else {
        closeSheet();
        commit("Zapisano zmiany", () => Object.assign(byId(task.id), data));
      }
    });
    $("#e-toggle", root)?.addEventListener("click", () => { closeSheet(); toggleTask(task.id); });
    $("#e-del", root)?.addEventListener("click", () => { closeSheet(); deleteTask(task.id); });
    $("#e-focus", root)?.addEventListener("click", () => openFocus(task.id));
    $("#e-plan", root)?.addEventListener("click", () => openPlan(task));

    if (isNew && preset.tytul) title.value = preset.tytul;
    paintPrio(); paintDate(); paintTags();
    if (isNew) { reparse(); setTimeout(() => title.focus(), 60); }
  }});
}

/* ---------- plan nauki ---------- */
function openPlan(t){
  if (!t || !isExam(t) || t.wykonane) return;
  if (hasPlan(t)){ toast("Ten sprawdzian ma już plan nauki."); return; }
  if (!t.termin){ toast("Najpierw ustaw termin sprawdzianu."); return; }
  const plan = studyPlan(t);
  const fitted = fitStudyPlan(t, plan);
  const hasChanges = fitted.some((choice, i) => choice.date !== plan[i].termin);
  const d = daysFromToday(t.termin);
  const rows = adapt => plan.map((p, i) => {
    const date = adapt ? fitted[i].date : p.termin;
    const pd = parseYmd(date);
    const reason = adapt && fitted[i].reason;
    return `<div class="plan-item"><div class="pd"><b>${pd.getDate()}</b>${WD_SHORT[pd.getDay()]}, ${MON_SHORT[pd.getMonth()]}</div><div class="pt">${esc(p.tytul.slice(t.tytul.length + 2).replace(/^./, c => c.toUpperCase()))}<small>${relDate(date)}, priorytet ${PRIO_LABEL[p.priorytet]}</small>${reason ? `<small>${esc(reason)}</small>` : ""}</div></div>`;
  }).join("");
  const body = `<p class="about">${d <= 0 ? "Termin jest dziś albo minął, więc proponuję jedną sesję na dziś." : `Do sprawdzianu ${nDays(d)}. Przy każdej sesji znajdziesz krótką wskazówkę, jak przećwiczyć materiał z pamięci.`}</p>
    ${hasChanges ? '<label><input id="p-adapt" type="checkbox" checked> Wybierz lżejsze dni według radaru</label>' : ""}
    <div class="plan-list" id="p-days" aria-live="polite">${rows(true)}</div>
    <div class="sheet-actions"><button class="btn primary" id="p-add">Dodaj ${plan.length} ${plural(plan.length,"sesję","sesje","sesji")} do listy</button></div>`;
  openSheet(`Plan nauki: ${t.tytul}`, body, { onMount: root => {
    const toggle = $("#p-adapt", root);
    toggle?.addEventListener("change", () => { $("#p-days", root).innerHTML = rows(toggle.checked); });
    $("#p-add", root).onclick = () => {
      const adapt = toggle?.checked ?? true;
      closeSheet();
      commit(`Dodano plan nauki (${plan.length})`, () => {
        plan.forEach((session, i) => tasks().push({id: nextId(), ...session, termin: adapt ? fitted[i].date : session.termin}));
      });
    };
  }});
}

/* ---------- dzień z radaru ---------- */
function openDay(date){
  const r = radar(14).find(o => o.date === date);
  const items = tasks().filter(t => t.termin === date).sort((a,b) => a.wykonane-b.wykonane || PRIO_W[b.priorytet]-PRIO_W[a.priorytet]);
  let body = items.length ? `<div class="daylist">${listOf(items)}</div>` : `<div class="empty">Na ten dzień nie ma terminów.</div>`;
  if (r && r.prepFor.length) body += `<p class="hint" style="margin-top:12px">Warto się tego dnia uczyć do: ${r.prepFor.map(t => esc(t.tytul)).join(", ")}.</p>`;
  body += `<div class="sheet-actions"><button class="btn primary" id="d-add">Dodaj zadanie na ten dzień</button></div>`;
  openSheet(longDate(date).replace(/^./, c => c.toUpperCase()), body, { onMount: root => {
    $("#d-add", root).onclick = () => openEditor(null, { termin: date });
    root.addEventListener("click", e => { if (e.target.closest("[data-act]")) setTimeout(() => { if (sheetOpen && !$("#e-title")) openDay(date); }, 560); });
  }});
}

/* ---------- odciążenie pojedynczego dnia ---------- */
function reliefOptions(){
  const days = radar(14);
  const options = [];
  for (const [index, day] of days.slice(0, 7).entries()){
    if (day.level !== "crunch") continue;
    const canAccept = candidate => candidate.load + PRIO_W.niski < BUSY;
    const earlier = days.slice(0, index).reverse().find(canAccept);
    const target = earlier || days.slice(index + 1, index + 8).find(canAccept);
    if (!target) continue;
    for (const task of day.items){
      if (task.termin !== day.date || task.priorytet !== "niski" || isExam(task) || studyParentId(task) !== null) continue;
      options.push({id: task.id, title: task.tytul, from: day.date, to: target.date});
    }
  }
  return options;
}

function openRelief(){
  const options = reliefOptions();
  if (!options.length){ toast("Brak propozycji dla obecnego planu."); return; }
  const rows = options.map(option => `<label><input type="radio" name="relief-task" value="${option.id}" required>
    <span><b>${esc(option.title)}</b><small>Obecny termin: ${shortDate(option.from)}<br>Proponowany termin: ${shortDate(option.to)} (${option.to < option.from ? "wcześniej" : "później"})</small></span></label>`).join("");
  openSheet("Lżejszy dzień", `<p class="about">Po przeniesieniu jednej sprawy wybrany dzień nadal będzie lekki według radaru. Późniejszą datę wybierz tylko dla sprawy z elastycznym terminem.</p>
    <form id="relief-form"><fieldset class="relief-choices"><legend>Którą sprawę chcesz przenieść?</legend>${rows}</fieldset>
    <div class="sheet-actions"><button class="btn primary" type="submit">Zmień wybrany termin</button><button type="button" class="btn" data-close>Anuluj</button></div></form>`, {onMount: root => {
    $("#relief-form", root).onsubmit = event => {
      event.preventDefault();
      const selected = $('input[name="relief-task"]:checked', root);
      if (!selected) return;
      const option = options.find(item => item.id === Number(selected.value));
      const current = reliefOptions().find(item => item.id === option.id);
      if (!current || current.from !== option.from || current.to !== option.to){
        closeSheet(); render(); toast("Plan się zmienił. Sprawdź aktualne propozycje."); return;
      }
      closeSheet();
      commit(`Nowy termin: ${shortDate(current.to)}`, () => { byId(current.id).termin = current.to; });
    };
  }});
}

/* ---------- przegląd zaległości ---------- */
function openTriage(){
  const queue = tasks().filter(t => !t.wykonane && t.termin && daysFromToday(t.termin) < 0).sort((a,b) => PRIO_W[b.priorytet]-PRIO_W[a.priorytet]).map(t => t.id);
  const total = queue.length; let i = 0; const actions = { done:0, moved:0, deleted:0 };
  openSheet("Przegląd zaległości", `<div id="tri"></div>`, { onMount: root => {
    const box = $("#tri", root);
    const show = () => {
      while (i < total && (!byId(queue[i]) || byId(queue[i]).wykonane)) i++;
      if (i >= total){
        box.innerHTML = `<div class="empty"><b>Zaległości ogarnięte</b>${[actions.done && `wykreślone: ${actions.done}`, actions.moved && `przesunięte: ${actions.moved}`, actions.deleted && `usunięte: ${actions.deleted}`].filter(Boolean).join(", ") || "Nic nie zmieniono."}.</div><div class="sheet-actions"><button class="btn primary" data-close2>Gotowe</button></div>`;
        $("[data-close2]", box).onclick = closeSheet; return;
      }
      const t = byId(queue[i]), d = -daysFromToday(t.termin);
      box.innerHTML = `<div class="tri-progress"><i style="width:${i/total*100}%"></i></div>
        <p class="hint" style="margin:0 0 10px">${i+1} z ${total}. Zdecyduj szybko, co z tym zrobić.</p>
        <div class="tri-card" id="tcard"><div class="ov">po terminie ${overdueFor(d)}</div><div class="tt">${esc(t.tytul)}</div><div class="ds">${esc(t.opis || "")}${t.tagi.length ? " " + t.tagi.map(g => esc(g)).join(", ") : ""}</div></div>
        <div class="tri-grid">
          <button class="btn primary" data-t="done">${I.check.replace('stroke-width="3"','stroke="currentColor" stroke-width="3"')} Już zrobione</button>
          <button class="btn" data-t="today">Na dziś</button>
          <button class="btn" data-t="tomorrow">Na jutro</button>
          <button class="btn" data-t="week">Za tydzień</button>
          <button class="btn" data-t="none">Bez terminu</button>
          <button class="btn danger" data-t="del">Nieaktualne, usuń</button>
        </div>
        <div class="sheet-actions" style="margin-top:10px"><button class="btn ghost" data-t="skip">Pomiń</button></div>`;
      $$("[data-t]", box).forEach(b => b.onclick = () => {
        const k = b.dataset.t;
        $$("[data-t]", box).forEach(button => { button.disabled = true; });
        const card = $("#tcard", box); card.style.transform = k === "done" ? "translateX(40px) rotate(2deg)" : k === "del" ? "translateX(-40px) rotate(-2deg)" : "translateY(-12px)"; card.style.opacity = "0";
        setTimeout(() => {
          if (!box.isConnected || byId(t.id) !== t) return;
          if (k !== "skip") commit("Zaktualizowano zaległość", () => {
            if (k === "done"){ setDone(t, true); actions.done++; }
            else if (k === "today"){ t.termin = today(); actions.moved++; }
            else if (k === "tomorrow"){ t.termin = addDays(today(),1); actions.moved++; }
            else if (k === "week"){ t.termin = addDays(today(),7); actions.moved++; }
            else if (k === "none"){ t.termin = null; actions.moved++; }
            else if (k === "del"){ removeTask(t.id); actions.deleted++; }
          });
          i++; show();
        }, 180);
      });
    };
    show();
  }});
}

/* ---------- tryb skupienia (pomodoro) ---------- */
const timer = { id:null, total:25*60, endAt:null, left:25*60, running:false, iv:null };
function captureFocus(){
  const {id, total, running} = timer;
  const left = running ? Math.max(0, (timer.endAt - Date.now())/1000) : timer.left;
  return {id, total, running, left};
}
function restoreFocus(focus){
  clearInterval(timer.iv);
  const values = focus || {id:null, total:timer.total, running:false, left:timer.total};
  Object.assign(timer, values, {iv:null, endAt:null});
  if (timer.running){
    timer.endAt = Date.now() + timer.left*1000;
    timer.iv = setInterval(timerTick, 500);
  }
  timerTick();
}
function fmtT(s){ s = Math.max(0, Math.round(s)); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }
function timerTick(){
  if (timer.running){ timer.left = (timer.endAt - Date.now())/1000; if (timer.left <= 0) return timerDone(); }
  const pill = $("#timerPill");
  pill.classList.toggle("on", timer.running && !(sheetOpen && $("#ft-ring")));
  pill.innerHTML = `${I.timer.replace("<svg",'<svg width="15" height="15"')} ${fmtT(timer.left)}`;
  const ring = $("#ft-ring");
  if (ring){ const C = 2*Math.PI*100; ring.style.strokeDashoffset = C * (1 - timer.left/timer.total); $("#ft-time").textContent = fmtT(timer.left); $("#ft-start").textContent = timer.running ? "Pauza" : (timer.left < timer.total ? "Wznów" : "Start"); }
}
function logFocus(min){
  if (!byId(timer.id) || min < 1) return;
  state.meta.focus.byTask[timer.id] = (state.meta.focus.byTask[timer.id]||0) + min;
  state.meta.focus.byDay[today()] = (state.meta.focus.byDay[today()]||0) + min;
  save();
}
function timerDone(){
  timer.running = false; clearInterval(timer.iv); timer.iv = null;
  logFocus(Math.round(timer.total/60)); timer.left = timer.total;
  haptic([200,100,200]);
  const t = byId(timer.id);
  try { document.title = "Koniec sesji · Ogarniacz"; setTimeout(() => document.title = "Ogarniacz", 8000); } catch(e){}
  timerTick();
  if (t && !t.wykonane) toast(`Koniec sesji (${Math.round(timer.total/60)} min). Zrobione?`, () => toggleTask(t.id), "Wykreśl");
  else toast("Koniec sesji. Zrób przerwę.");
  if (tab === "postepy") render();
}
function openFocus(id){
  const t = byId(id); if (!t) return;
  if (timer.id !== id){
    logFocus(Math.round((timer.total - captureFocus().left)/60));
    restoreFocus(null);
    timer.id = id;
  }
  const C = 2*Math.PI*100;
  openSheet("Skupienie", `<p class="timer-task">${esc(t.tytul)}</p>
    <div class="timer"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--block)" stroke-width="10"/><circle id="ft-ring" cx="110" cy="110" r="100" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear"/></svg>
    <div class="tv"><div><b id="ft-time">${fmtT(timer.left)}</b><span>telefon odłóż ekranem w dół</span></div></div></div>
    <div class="quick-dates" style="justify-content:center">${[15,25,50].map(m => `<button class="chip" data-m="${m}" aria-pressed="${timer.total===m*60}">${m} min</button>`).join("")}</div>
    <div class="sheet-actions"><button class="btn primary" id="ft-start">Start</button><button class="btn" id="ft-reset">Od nowa</button></div>
    ${state.meta.focus.byTask[id] ? `<p class="hint" style="text-align:center;margin-top:14px">Już poświęcone temu zadaniu: ${state.meta.focus.byTask[id]} min</p>` : ""}`,
  { onMount: root => {
    $("#ft-start", root).onclick = () => {
      if (timer.running){ timer.running = false; timer.left = (timer.endAt - Date.now())/1000; clearInterval(timer.iv); timer.iv = null; }
      else { timer.running = true; timer.endAt = Date.now() + timer.left*1000; if (!timer.iv) timer.iv = setInterval(timerTick, 500); }
      timerTick();
    };
    $("#ft-reset", root).onclick = () => {
      logFocus(Math.round((timer.total - captureFocus().left)/60));
      restoreFocus({id, total:timer.total, left:timer.total, running:false});
    };
    $$("[data-m]", root).forEach(b => b.onclick = () => { if (timer.running) return; timer.total = timer.left = +b.dataset.m*60; $$("[data-m]", root).forEach(x => x.setAttribute("aria-pressed", x === b)); timerTick(); });
    timerTick();
  }, onClose: () => setTimeout(timerTick, 10) });
}
$("#timerPill").addEventListener("click", () => { if (timer.id !== null) openFocus(timer.id); });
document.addEventListener("visibilitychange", timerTick);

/* ---------- ustawienia: import / eksport ---------- */
function openSettings(){
  const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files:[new File(["{}"],"a.json",{type:"application/json"})] })); } catch(e){ return false; } })();
  const body = `
    <div class="menu">
      <button id="s-import">${I.upload}<span>Wczytaj zadania z pliku JSON<span class="sub">Możesz też przeciągnąć plik na okno</span></span></button>
      <button id="s-export">${I.download}<span>Zapisz zadania do pliku JSON<span class="sub">zadania.json, ${nTasks(tasks().length)}</span></span></button>
      ${canShareFiles ? `<button id="s-share">${I.share}<span>Udostępnij plik<span class="sub">AirDrop, Pliki, wiadomość</span></span></button>` : ""}
      <button id="s-copy">${I.copy}<span>Kopiuj JSON do schowka</span></button>
    </div>
    <div class="menu">
      <button id="s-sample">${I.reset}<span>Wczytaj przykładowe zadania</span></button>
      <button id="s-clear" class="danger">${I.trash}<span>Usuń wszystkie zadania</span></button>
    </div>
    <div class="callout">${ILL.zadania}<div class="nt"><b>Na iPhonie</b><p>Na iPhonie: otwórz w Safari, stuknij Udostępnij i wybierz „Do ekranu początkowego”. Ogarniacz otworzy się na pełnym ekranie i będzie działał bez internetu.</p></div></div>
    <p class="about">Skróty na komputerze: <b>N</b> nowe zadanie, <b>/</b> szukaj, <b>1–4</b> widoki. Zadania są zapisywane w tej przeglądarce, a plik JSON służy do przenoszenia ich gdzie indziej.</p>`;
  openSheet("Ustawienia", body, { onMount: root => {
    $("#s-import", root).onclick = () => $("#fileInput").click();
    $("#s-export", root).onclick = () => { exportFile(); closeSheet(); };
    $("#s-share", root)?.addEventListener("click", async () => { try { await navigator.share({ files:[new File([serializeDoc(state.doc)], "zadania.json", {type:"application/json"})], title:"zadania.json" }); } catch(e){} });
    $("#s-copy", root).onclick = async () => { try { await navigator.clipboard.writeText(serializeDoc(state.doc)); toast("Skopiowano JSON"); } catch(e){ toast("Nie udało się skopiować. Użyj zapisu do pliku."); } };
    $("#s-sample", root).onclick = () => { closeSheet(); commit("Wczytano przykładowe zadania", () => replaceDocument(parseDoc(JSON.stringify(SAMPLE)).doc)); };
    $("#s-clear", root).onclick = () => { closeSheet(); commit(`Usunięto ${nTasks(tasks().length)}`, () => replaceDocument({...state.doc, zadania:[]})); };
  }});
}
function exportFile(){
  let framed = false; try { framed = window.self !== window.top; } catch(e){ framed = true; }
  if (framed){
    // w osadzonym podglądzie przeglądarka blokuje pobieranie, więc pokazujemy JSON do skopiowania
    const json = serializeDoc(state.doc);
    setTimeout(() => openSheet("Zapis do pliku", `<p class="about">W tym podglądzie pobieranie plików jest zablokowane. Skopiuj JSON i zapisz go jako <b>zadania.json</b>, albo otwórz aplikację w osobnej karcie.</p>
      <textarea class="inp" readonly style="min-height:240px;font:13px/1.4 ui-monospace,Menlo,monospace">${esc(json)}</textarea>
      <div class="sheet-actions"><button class="btn primary" id="x-copy">${I.copy} Kopiuj JSON</button></div>`, { onMount: root => {
        $("#x-copy", root).onclick = async () => { try { await navigator.clipboard.writeText(json); toast("Skopiowano JSON"); } catch(e){ $("textarea", root).select(); toast("Zaznaczyłem tekst, skopiuj go ręcznie"); } };
      }}), 340);
    return;
  }
  const blob = new Blob([serializeDoc(state.doc)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "zadania.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Zapisano ${nTasks(tasks().length)} do zadania.json`);
}
async function importFile(file){
  if (!file) return;
  let parsed;
  try { parsed = parseDoc(await file.text()); }
  catch(e){ toast(`Nie wczytano „${file.name}”: ${e.message}`); return; }
  const { doc, warn } = parsed;
  const apply = mode => {
    closeSheet();
    commit(mode === "replace" ? `Wczytano ${nTasks(doc.zadania.length)} z pliku` : `Dołączono ${nTasks(doc.zadania.length)}`, () => {
      if (mode === "replace") replaceDocument(doc);
      else mergeDocument(doc);
    });
  };
  if (!tasks().length && !warn.length) return apply("replace");
  openSheet("Wczytywanie pliku", `
    <p class="about"><b style="color:var(--text)">${esc(file.name)}</b>: ${nTasks(doc.zadania.length)} (${doc.zadania.filter(t => t.wykonane).length} zrobionych, ${doc.zadania.filter(t => !t.termin).length} bez terminu).</p>
    ${warn.length ? `<div class="callout warn">${ILL.stos}<div class="nt"><b>Poprawiłem ${warn.length} ${plural(warn.length,"rzecz","rzeczy","rzeczy")} w pliku</b><p>${warn.slice(0,6).map(esc).join("<br>")}${warn.length>6?"<br>…":""}</p></div></div>` : ""}
    <div class="sheet-actions"><button class="btn primary" id="i-rep">Zastąp obecne (${tasks().length})</button><button class="btn" id="i-add">Dołącz do obecnych</button></div>`,
  { onMount: root => { $("#i-rep", root).onclick = () => apply("replace"); $("#i-add", root).onclick = () => apply("merge"); } });
}
$("#fileInput").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; importFile(f); });
// przeciągnij i upuść
let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types||[])].includes("Files")) { dragDepth++; $("#dropHint").classList.add("on"); e.preventDefault(); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) $("#dropHint").classList.remove("on"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("#dropHint").classList.remove("on"); const f = e.dataTransfer?.files?.[0]; if (f) importFile(f); });

/* ---------- toast ---------- */
function toast(msg, action, actionLabel="Cofnij"){
  const box = $("#toasts");
  box.innerHTML = "";
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status");
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action){ const b = document.createElement("button"); b.textContent = actionLabel; b.onclick = () => { el.remove(); action(); }; el.appendChild(b); }
  box.appendChild(el);
  setTimeout(() => el.remove(), action ? 5000 : 2600);
}

/* ---------- start ---------- */
function startDemo(){
  const entries = [
    ["Kolokwium z sieci", "Rozdziały 3–8", 7, "wysoki", ["studia"]],
    ["Oddać sprawozdanie z laboratorium", "Wgraj raport przed zajęciami.", 4, "wysoki", ["lab"]],
    ["Pokazać prototyp na zajęciach", "Przygotuj trzy ekrany aplikacji.", 4, "wysoki", ["projekt"]],
    ["Uporządkować notatki", "Wybierz dzień, kiedy masz wolne popołudnie.", 4, "niski", ["studia"]]
  ];
  const zadania = entries.map(([tytul, opis, offset, priorytet, tagi], i) => ({
    id:i+1, tytul, opis, termin:addDays(today(), offset), priorytet, wykonane:false, tagi
  }));
  state = {doc:{wersja:1, zadania}, meta:emptyMeta()};
  $("#demoBar").hidden = false;
}
if (DEMO) startDemo(); else load();
render();
setInterval(() => { const d = today(); if (d !== window._lastDay){ window._lastDay = d; render(); } }, 60000); window._lastDay = today();
if ("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
